cv.onpointermove=e=>{if(!drag)return;const[px,py]=cpos(e);if(drag==2){const o=ovs[selO];o.x=Math.min(1,Math.max(-1,px-.5));o.y=Math.min(1,Math.max(-1,py-.5));return}const x=texts[selT];x.x=Math.min(1,Math.max(0,px));x.y=Math.min(1,Math.max(0,py))};
cv.onpointerup=()=>drag=0;
async function exp(){if(!clips.length)return toast('Add a video first');if(!window.MediaRecorder)return toast('Export isn’t supported in this browser');
pause();audio();await ac.resume();selT=-1;const st=cv.captureStream(30);dest.stream.getAudioTracks().forEach(k=>st.addTrack(k));
const m=['video/mp4;codecs=avc1,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'].find(x=>MediaRecorder.isTypeSupported(x))||'',ch=[];
try{rec=new MediaRecorder(st,m?{mimeType:m,videoBitsPerSecond:5e6}:{})}catch(_){rec=new MediaRecorder(st)}rec.ondataavailable=e=>e.data.size&&ch.push(e.data);
rec.onstop=()=>{const ty=rec.mimeType||'video/webm';if(!ch.length){$('#mb').innerHTML='<p>Export failed: nothing was recorded.</p><button id="cl">Close</button>';$('#cl').onclick=()=>$('#mo').hidden=true;return}result(new Blob(ch,{type:ty}),ty.includes('mp4')?'mp4':'webm')};
$('#mo').hidden=false;$('#mb').innerHTML='<div style="font-size:16px;font-weight:700">Exporting <span id="pc">0%</span></div><p class="mu">Keep this screen open. Export runs in real time.</p>';
seek(0);setTimeout(()=>{rec.start(200);exporting=true;play()},400)}
function fin(){exporting=false;setTimeout(()=>rec.state!='inactive'&&rec.stop(),300)}
function result(b,ext){const u=URL.createObjectURL(b);$('#mb').innerHTML=`<video src="${u}" controls playsinline></video><div class="row"><button class="ac" id="sv">Save or share</button><button id="cl">Close</button></div><p class="mu" id="er"></p><p class="mu">Format: .${ext}. If saving is blocked, press and hold the video to download it.</p>`;
$('#cl').onclick=()=>$('#mo').hidden=true;
$('#sv').onclick=async()=>{const f=new File([b],'editor-export.'+ext,{type:b.type}),er=$('#er');er.textContent='Saving…';try{if(await saveNative(b,f.name,p=>er.textContent='Preparing '+p+'%')){er.textContent='Done. Pick where to save in the share sheet.';return}
if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});er.textContent='';return}
const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();er.textContent='Download started.'}catch(x){er.textContent='Save failed: '+(x&&x.message||x)}}}
$('#ex').onclick=()=>exp().catch(e=>{exporting=false;$('#mo').hidden=false;$('#mb').innerHTML='<p>Export failed: '+(e&&e.message||e)+'</p><button id="cl">Close</button>';$('#cl').onclick=()=>$('#mo').hidden=true});
ui();panel();tick();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
