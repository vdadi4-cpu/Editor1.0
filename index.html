else if(tab=='cg')h=rg('fb','Exposure',50,150,1,c.f.b)+rg('fc','Contrast',50,150,1,c.f.c)+rg('fs','Saturate',0,200,1,c.f.s)+rg('tp','Warm / cool',-100,100,1,c.tp)+rg('tn','Tint',-100,100,1,c.tn)+rg('hu','Hue',-180,180,1,c.hu)+rg('se','Sepia',0,100,1,c.se)+rg('fd','Fade',0,100,1,c.fd)+rg('vg','Vignette',0,100,1,c.vg)+rg('bl','Blur',0,20,1,c.bl);

if(o)h+=`<div class="chips">${[['none','Full'],['circle','Circle'],['ellipse','Oval'],['box','Box'],['heart','Heart'],['star','Star']].map(([k,l])=>`<button data-om="${k}" class="${o.mk==k?'on':''}">${l}</button>`).join('')}</div>`+rg('ost','Start',0,Math.max(total(),1),.1,o.st,s1)+rg('osc','Size',.1,1.5,.05,o.sc,pc)+rg('ox','Move X',-1,1,.01,o.x,pc)+rg('oy','Move Y',-1,1,.01,o.y,pc)+rg('oo','Opacity',0,100,1,Math.round(o.o*100),q=>q+'%')+`<div class="chips"><button data-ck="1" class="${o.ck.on?'on':''}">Chroma key ${o.ck.on?'on':'off'}</button><button data-cp="#00ff00">Green</button><button data-cp="#0000ff">Blue</button><input type="color" id="occ" value="${o.ck.col}"></div>`+rg('ocs','Similarity',0,100,1,o.ck.sim)+rg('ocm','Smooth',0,50,1,o.ck.sm);else h+='<p class="mu">Add a video to place it on top. Drag it on the preview. Chroma key removes a green or blue background.</p>'}
else if(tab=='mus'){h=`<div class="chips"><button class="ac" id="am">♪ Import music</button>${mus?'<button id="dm">Remove</button>':''}</div>`;if(mus)h+=`<p class="mu">${mus.name}</p>`+rg('mvo','Volume',0,2,.05,mus.vol,pc)+rg('mdk','Ducking',0,90,1,mus.duck,q=>q+'%')+rg('mst','Start',0,Math.max(total(),1),.1,mus.st,s1)+'<p class="mu">Ducking lowers the music while the video has speech or sound.</p>';else h+='<p class="mu">Import a song or sound from your phone storage.</p>'}
else if(tab=='speed')h=rg('sp','Speed',.25,4,.05,c.sp,x=>(+x).toFixed(2)+'x');
else if(tab=='vol')h=rg('vo','Volume',0,2,.05,c.vol,pc)+rg('fi','Fade in',0,5,.1,c.fi,s1)+rg('fo','Fade out',0,5,.1,c.fo,s1);
else if(tab=='fil')h=`<div class="chips">${Object.keys(PRE).map(k=>`<button data-p="${k}">${k}</button>`).join('')}</div>`+rg('fb','Bright',50,150,1,c.f.b)+rg('fc','Contrast',50,150,1,c.f.c)+rg('fs','Saturate',0,200,1,c.f.s);
else if(tab=='text'){const x=texts[selT];h=`<div class="chips"><button class="ac" id="at">Add text</button></div>`;if(x)h+=`<div class="rw"><input type="text" id="tt" value="${x.txt.replace(/"/g,'&quot;')}"><input type="color" id="tc" value="${x.c}"></div>`+TX(x)+rg('tz','Size',20,140,1,x.z)+rg('top','Opacity',0,100,1,Math.round(x.op*100),q=>q+'%')+rg('ts','Start',0,Math.max(total(),1),.1,x.s,s2)+rg('te','End',0,Math.max(total(),1),.1,x.e,s2);else h+='<p class="mu">Tap Add text, then drag it on the preview.</p>'}
P.innerHTML=h}
$('#pn').addEventListener('pointerdown',e=>{if(e.target.type=='range'||e.target.type=='color')snap()});

if(id=='in'){c.in=Math.min(+val,c.out-.2);e.target.value=c.in;seek(off(sel))}
else if(id=='out'){c.out=Math.max(+val,c.in+.2);e.target.value=c.out;seek(off(sel)+len(c)-.05)}
else if(id=='sp'){c.sp=+val;v.playbackRate=c.sp}
else if(id=='vo'){c.vol=+val;if(gain)gain.gain.value=c.vol}
else if(id=='fb')c.f.b=+val;else if(id=='fc')c.f.c=+val;else if(id=='fs')c.f.s=+val;
else if(id=='op')tf(c,'o',val/100);else if(id=='scl')tf(c,'s',+val);else if(id=='px')tf(c,'x',+val);else if(id=='py')tf(c,'y',+val);else if(id=='rt')tf(c,'r',+val);
else if(id=='tp')c.tp=+val;else if(id=='vg')c.vg=+val;else if(id=='bl')c.bl=+val;else if(id=='fl')c.fl=val/24;else if(id=='iso')c.iso=+val;else if(id=='cb')c.cb=+val;else if(id=='ms')c.ms=+val;
else if(id=='fi')c.fi=+val;else if(id=='fo')c.fo=+val;else if(id=='cc')c.col=val;else if(id=='top')x.op=val/100;else if(id=='ost')o.st=+val;else if(id=='osc')o.sc=+val;else if(id=='ox')o.x=+val;else if(id=='oy')o.y=+val;else if(id=='oo')o.o=val/100;else if(id=='ocs')o.ck.sim=+val;else if(id=='ocm')o.ck.sm=+val;else if(id=='occ')o.ck.col=val;else if(id=='trd')c.tr.d=+val;else if(id=='mvo')mus.vol=+val;else if(id=='mdk')mus.duck=+val;else if(id=='mst')mus.st=+val;else if(id=='mx')c.mx=+val;else if(id=='my')c.my=+val;else if(id=='mr')c.mr=+val;else if(id=='tn')c.tn=+val;else if(id=='hu')c.hu=+val;else if(id=='fd')c.fd=+val;else if(id=='se')c.se=+val;

else if(id=='tt'){x.txt=val||' '}else if(id=='tc')x.c=val;else if(id=='tz')x.z=+val;
else if(id=='ts'){x.s=Math.min(+val,x.e-.2)}else if(id=='te'){x.e=Math.max(+val,x.s+.2)}
const oo=$('#o_'+id);if(oo)oo.textContent=FM[id]?FM[id](e.target.value):e.target.value;renderTL();if(id=='sp'||id=='in'||id=='out')head()});
$('#pn').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
const c=clips[sel],x=texts[selT],o=ovs[selO];if(b.dataset.r){ratio=b.dataset.r;panel()}else if(b.dataset.fit){fit=b.dataset.fit;panel()}
else if(b.dataset.p){snap();const p=PRE[b.dataset.p];clips[sel].f={b:p[0],c:p[1],s:p[2],x:p[3]};panel()}
else if(b.dataset.tr){snap();c.tr={...c.tr,type:b.dataset.tr};ui();panel();if(c.tr.type!='none'){seek(Math.max(0,off(sel)-1));play()}}
else if(b.id=='ao')$('#fo').click();else if(b.id=='do'){snap();ovs.splice(selO,1);selO=-1;ui();panel();seek(t)}
else if(b.dataset.om){snap();o.mk=b.dataset.om;panel()}else if(b.dataset.ck){snap();o.ck.on=o.ck.on?0:1;panel()}else if(b.dataset.cp){snap();o.ck.col=b.dataset.cp;o.ck.on=1;panel()}

else if(b.dataset.mi){snap();c.mi=c.mi?0:1;panel()}else if(b.dataset.sw){snap();if(tab=='text'&&x)x.c=b.dataset.sw;else if(c&&!c.url)c.col=b.dataset.sw;panel()}

if(!d||!isFinite(d)){toast('Couldn’t read '+f.name);continue}clips.push(D({url,mid:keep(f),name:f.name.replace(/\.[^.]+$/,''),dur:d,in:0,out:d,sp:1,vol:1,f:{b:100,c:100,s:100,x:''}}))}

ovs.push({url,mid:keep(f),name:f.name.replace(/\.[^.]+$/,''),dur:d,in:0,out:d,st:t,sc:.5,x:0,y:-.2,o:1,mk:'none',ck:{on:0,col:'#00ff00',sim:35,sm:15}});selO=ovs.length-1;tab='ov';ui();panel();seek(t)};

$('#xr').onclick=e=>{const b=e.target.closest('.tx');if(b){selT=+b.dataset.i;tab='text';ui();panel()}else if(ai>=0&&v2.videoWidth){const o=ovs[ai],ow=o.sc,oh=ow*v2.videoHeight/v2.videoWidth*(R[ratio][0]/R[ratio][1]);if(Math.abs(px-.5-o.x)<ow/2&&Math.abs(py-.5-o.y)<oh/2){selO=ai;drag=2;snap();cv.setPointerCapture(e.pointerId);tab='ov';ui();panel()}}};

function cpos(e){const r=cv.getBoundingClientRect(),[W,H]=R[ratio],s=Math.min(r.width/W,r.height/H),dw=W*s,dh=H*s;return[(e.clientX-r.left-(r.width-dw)/2)/dw,(e.clientY-r.top-(r.height-dh)/2)/dh]}
cv.onpointerdown=e=>{const[px,py]=cpos(e);let b=-1,bd=.2;texts.forEach((x,i)=>{if(t<x.s||t>x.e)return;const d=Math.hypot(x.x-px,(x.y-py)*.6);if(d<bd){bd=d;b=i}});
if(b>=0){selT=b;drag=1;snap();cv.setPointerCapture(e.pointerId);tab='text';ui();panel()}};
cv.onpointermove=e=>{if(!drag)return;const[px,py]=cpos(e);if(drag==2){const o=ovs[selO];o.x=Math.min(1,Math.max(-1,px-.5));o.y=Math.min(1,Math.max(-1,py-.5));return}const x=texts[selT];x.x=Math.min(1,Math.max(0,px));x.y=Math.min(1,Math.max(0,py))};

const a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();er.textContent='Download started.'}catch(x){er.textContent='Save failed: '+(x&&x.message||x)}}}
