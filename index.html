const mdur=(f,url)=>/^image/.test(f.type)?Promise.resolve(60):new Promise(r=>{const x=document.createElement('video');x.preload='metadata';x.onloadedmetadata=()=>r(x.duration);x.onerror=()=>r(0);x.src=url});

function beatCore(d,sr){const Hs=Math.round(sr*.01),n=Math.min(Math.floor(d.length/Hs),18000),E=new Float32Array(n),O=new Float32Array(n);
for(let i=0;i<n;i++){let s=0;for(let j=0;j<Hs;j++){const x=d[i*Hs+j];s+=x*x}E[i]=Math.sqrt(s/Hs)}
for(let i=1;i<n;i++){let m=0,c=0;for(let k=1;k<=12&&i-k>=0;k++){m+=E[i-k];c++}O[i]=Math.max(0,E[i]-m/c*1.1)}
let best=-1,bL=50,bp=0;for(let L=37;L<=75;L+=.1)for(let p=0;p<L;p++){let s=0;for(let x=p;x<n;x+=L){const r=Math.round(x);s+=Math.max(O[r-1]||0,O[r]||0,O[r+1]||0)}if(s>best){best=s;bL=L;bp=p}}
const out=[];for(let x=bp;x<n;x+=bL)out.push(+(x*.01).toFixed(3));return{bpm:Math.round(6000/bL),beats:out}}
async function detect(){if(!mus)return toast('Import music first');toast('Analysing beats…');try{const r=await fetch(mus.url),A=new(window.AudioContext||window.webkitAudioContext)(),b=await A.decodeAudioData(await r.arrayBuffer());if(A.close)A.close();const o=beatCore(b.getChannelData(0),b.sampleRate);mus.beats=o.beats;mus.bpm=o.bpm;toast(o.bpm+' BPM · '+o.beats.length+' beats');ui();panel()}catch(e){toast('Beat detection failed: '+(e&&e.message||e))}}
const zk=(L,i)=>{const b={o:1,s:1,x:0,y:0,r:0,ms:.8,mx:0,my:0,mr:0,e:'lin'};return[{...b,t:0,s:i%2?1.15:1},{...b,t:L,s:i%2?1:1.15}]};
async function autoEdit(files){if(!mus||!mus.beats||!mus.beats.length)return toast('Import music and tap Detect beats first');const items=[];
for(const f of files){const url=URL.createObjectURL(f),d=await mdur(f,url);if(d&&isFinite(d))items.push({url,mid:keep(f),img:/^image/.test(f.type),dur:d,name:f.name.replace(/\.[^.]+$/,'')})}
if(!items.length)return toast('No usable files');snap();const cuts=[0];for(let i=BN;i<mus.beats.length;i+=BN){const x=mus.st+mus.beats[i];if(x>cuts[cuts.length-1]+.2)cuts.push(x)}cuts.push(Math.max(mus.st+mus.dur,cuts[cuts.length-1]+.5));
const nc=[],kinds=['fade','sl','zm','wp','dip','sr'];let kk=0;
for(let i=0;i<cuts.length-1&&nc.length<80;i++){const it=items[i%items.length],L=cuts[i+1]-cuts[i],sp=it.img||it.dur>=L?1:Math.max(.25,it.dur/L);
nc.push(D({url:it.url,mid:it.mid,img:it.img,name:it.name,dur:it.dur,in:0,out:it.img?L:Math.min(it.dur,L*sp),sp,vol:1,f:{b:100,c:100,s:100,x:''},kf:it.img?zk(L,i):[],tr:i&&BT!='none'?{type:BT=='mix'?kinds[kk++%kinds.length]:BT,d:Math.min(.4,L*.4)}:{type:'none',d:.5}}))}
clips=nc;sel=0;tmode='main';kfT=false;fit='fill';t=0;tab='bt';chg();toast('Beat edit ready: '+nc.length+' clips')}
$('#fb').onchange=e=>{const f=[...e.target.files];e.target.value='';if(f.length)autoEdit(f)};
const b64=b=>new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result.split(',')[1]);fr.onerror=()=>j(new Error('Read failed'));fr.readAsDataURL(b)});
async function saveTo(b,nm,u,er){er.textContent='Choose where to save…';try{const C=window.Capacitor;
if(C&&C.isNativePlatform&&C.isNativePlatform()){await NP2('SaveFile','pick',{name:nm,mime:b.type||'video/mp4'});const CH=3*1024*1024;for(let o=0;o<b.size;o+=CH){await NP2('SaveFile','write',{data:await b64(b.slice(o,o+CH))});er.textContent='Saving '+Math.min(100,Math.round(100*(o+CH)/b.size))+'%'}await NP2('SaveFile','close',{});er.textContent='Saved to the location you chose.';return}
if(window.showSaveFilePicker){const h=await showSaveFilePicker({suggestedName:nm}),w=await h.createWritable();await w.write(b);await w.close();er.textContent='Saved.';return}

catch(x){const m=String(x&&x.message||x);er.textContent=/cancel/i.test(m)?'Save cancelled.':'Save failed: '+m+'. Try Share instead.'}}
async function shareF(b,nm,er){er.textContent='Preparing…';try{if(await saveNative(b,nm,p=>er.textContent='Preparing '+p+'%')){er.textContent='Done.';return}const f=new File([b],nm,{type:b.type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});er.textContent=''}else er.textContent='Sharing isn’t available here. Use Save to…'}catch(x){er.textContent='Share failed: '+(x&&x.message||x)}}
